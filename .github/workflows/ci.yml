name: gen-ai-platform-ci

# Trunk flow: tests and the UI build gate every PR and push to main; a push to main publishes the image. A release is
# cut by bumping api/genai/__init__.py: the first main build of a new version also pushes :<version>, the tag the chart
# pins (helm/gen-ai-platform/values.yaml). Chart and doc changes don't rebuild.

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'helm/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'helm/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - name: API tests
        working-directory: api
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI type-check and build
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tags
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/gen-ai-platform
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' api/genai/__init__.py)
          {
            echo "tags<<EOF"
            echo "$IMAGE:sha-${GITHUB_SHA::12}"
            echo "$IMAGE:latest"
            # A release tag is immutable once pushed: only the first build of a version gets it.
            if ! docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
              echo "$IMAGE:$version"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
